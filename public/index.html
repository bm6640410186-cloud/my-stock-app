<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockUniform AI - ระบบจัดการสต็อกชุดนักศึกษา</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; display: flex; height: 100vh; background: #f4f6f9; }
    .sidebar { width: 240px; background: #1a233a; color: #fff; padding: 20px 0; display: flex; flex-direction: column; }
    .sidebar h2 { padding: 0 20px; font-size: 18px; margin-bottom: 20px; }
    .nav-item { padding: 12px 20px; color: #a6b0cf; text-decoration: none; cursor: pointer; display: block; }
    .nav-item:hover, .nav-item.active { background: #263353; color: #fff; border-left: 4px solid #d9822b; }
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .btn-primary { background: #d9822b; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Sidebar ด้านซ้าย (เมนูครบ 6 หน้า) -->
  <div class="sidebar">
    <h2>StockUniform AI</h2>
    <div class="nav-item active" data-view="dashboard">📊 แดชบอร์ด</div>
    <div class="nav-item" data-view="products">📦 สินค้าและสต็อก</div>
    <div class="nav-item" data-view="sales">🛒 ขายสินค้า</div>
    <div class="nav-item" data-view="deadstock">⚠️ สินค้าค้างสต็อก</div>
    <div class="nav-item" data-view="receive">📥 รับสินค้าเข้า</div>
    <div class="nav-item" data-view="forecast">🤖 วิเคราะห์สต็อก (AI)</div>
    <div style="margin-top: auto; padding: 20px;">
      <button id="logoutBtn" style="width: 100%; background: #dc3545; color: #fff; border: none; padding: 8px; border-radius: 4px; cursor: pointer;">ออกจากระบบ</button>
    </div>
  </div>

  <!-- เนื้อหาหลัก -->
  <div class="main-content">
    <div id="view-dashboard" class="view"></div>

    <div id="view-products" class="view" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>จัดการสินค้าและสต็อก</h2>
        <button class="btn-primary" onclick="openProductForm()">+ เพิ่มสินค้าใหม่</button>
      </div>
      <div id="productsTableWrap"></div>
    </div>

    <div id="view-sales" class="view" style="display:none;"></div>
    <div id="view-deadstock" class="view" style="display:none;"></div>
    <div id="view-receive" class="view" style="display:none;"></div>
    <div id="view-forecast" class="view" style="display:none;"></div>
  </div>

  <!-- Modal เพิ่มสินค้าใหม่ -->
  <div id="productModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; width:90%; max-width:500px; padding:25px; border-radius:12px; max-height:90vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
        <h3 style="margin:0;">✨ เพิ่มสินค้าใหม่</h3>
        <span onclick="closeProductForm()" style="cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
      </div>

      <form id="productForm">
        <div style="margin-bottom:12px;">
          <label style="display:block; font-weight:bold; margin-bottom:5px;">หมวดหมู่สินค้า:</label>
          <select id="pCategory" onchange="toggleCategoryFields()" style="width:100%; padding:9px; border:1px solid #ccc; border-radius:6px;" required>
            <option value="กระโปรงนักศึกษา">กระโปรงนักศึกษา</option>
            <option value="เสื้อนักศึกษา">เสื้อนักศึกษา</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </div>

        <!-- ตัวเลือก: กระโปรง -->
        <div id="skirtFields" style="background:#f8f9fa; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #e9ecef;">
          <div style="margin-bottom:10px;">
            <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:13px;">ทรง / รูปแบบกระโปรง:</label>
            <select id="pSkirtStyle" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
              <option value="พลีทกลีบเล็ก">พลีทกลีบเล็ก</option>
              <option value="พลีทกลีบใหญ่">พลีทกลีบใหญ่</option>
              <option value="ทรงเอ">ทรงเอ (ไม่ผ่า)</option>
              <option value="ทรงเอ-ผ่าหน้า">ทรงเอ (ผ่าหน้า)</option>
              <option value="ทรงเอ-ผ่าหลัง">ทรงเอ (ผ่าหลัง)</option>
              <option value="ทรงแคบ">ทรงแคบ</option>
            </select>
          </div>
          <div style="display:flex; gap:10px;">
            <div style="flex:1;">
              <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:13px;">ขนาดเอว (นิ้ว):</label>
              <input type="number" id="pWaist" placeholder="เช่น 25" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <div style="flex:1;">
              <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:13px;">ความยาว (นิ้ว):</label>
              <input type="number" id="pLength" placeholder="เช่น 18" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
          </div>
        </div>

        <!-- ตัวเลือก: เสื้อ -->
        <div id="shirtFields" style="background:#f8f9fa; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #e9ecef; display:none;">
          <div style="display:flex; gap:10px; margin-bottom:10px;">
            <div style="flex:1;">
              <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:13px;">รูปแบบ/ทรงเสื้อ:</label>
              <select id="pShirtGender" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                <option value="เสื้อผู้หญิง">เสื้อผู้หญิง</option>
                <option value="เสื้อผู้ชาย">เสื้อผู้ชาย</option>
              </select>
            </div>
            <div style="flex:1;">
              <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:13px;">ความยาวแขน:</label>
              <select id="pShirtSleeve" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                <option value="แขนสั้น">แขนสั้น</option>
                <option value="แขนยาว">แขนยาว</option>
              </select>
            </div>
          </div>
          <div style="display:flex; gap:10px;">
            <div style="flex:1;">
              <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:13px;">โทนสี:</label>
              <select id="pShirtColor" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                <option value="ขาวนวล">ขาวนวล</option>
                <option value="ขาวโอโม่">ขาวโอโม่</option>
              </select>
            </div>
            <div style="flex:1;">
              <label style="display:block; font-weight:bold; margin-bottom:3px; font-size:13px;">ไซส์ (รอบอก/เบอร์):</label>
              <input type="text" id="pShirtSize" placeholder="เช่น S, M, L หรือ 36" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
          </div>
        </div>

        <!-- ตัวเลือก: สินค้าอื่นๆ -->
        <div id="generalNameField" style="margin-bottom:12px; display:none;">
          <label style="display:block; font-weight:bold; margin-bottom:5px;">ชื่อสินค้า:</label>
          <input type="text" id="pName" placeholder="เช่น กางเกงสแล็ค" style="width:100%; padding:9px; border:1px solid #ccc; border-radius:6px;">
        </div>
        <div id="generalSizeField" style="margin-bottom:12px; display:none;">
          <label style="display:block; font-weight:bold; margin-bottom:5px;">ไซส์ (ถ้ามี):</label>
          <input type="text" id="pSize" placeholder="เช่น XL" style="width:100%; padding:9px; border:1px solid #ccc; border-radius:6px;">
        </div>

        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <div style="flex:1;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">จำนวนสต็อก:</label>
            <input type="number" id="pStock" value="0" min="0" required style="width:100%; padding:9px; border:1px solid #ccc; border-radius:6px;">
          </div>
          <div style="flex:1;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">ราคาทุน (฿):</label>
            <input type="number" id="pCost" value="0" min="0" required style="width:100%; padding:9px; border:1px solid #ccc; border-radius:6px;">
          </div>
        </div>

        <div style="margin-bottom:20px;">
          <label style="display:block; font-weight:bold; margin-bottom:5px;">ราคาขาย (฿):</label>
          <input type="number" id="pPrice" value="0" min="0" required style="width:100%; padding:9px; border:1px solid #ccc; border-radius:6px;">
        </div>

        <button type="submit" class="btn-primary" style="width:100%; padding:12px; font-size:16px;">💾 บันทึกสินค้า</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
